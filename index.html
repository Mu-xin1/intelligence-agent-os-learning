  <script>window.__FDE_DATA__={"generatedAt":"2026-08-28T06:21:22.856Z","fde90":{"days":[{"title":"FDE 是结果所有者，不是文档所有者","why":"先建立责任边界，避免把 FDE 学成售前、PM 或纯工程。","standard":"4C 是 Context、Code、Calibration、Compounding；结果必须同时可运行、可衡量、可采用、可复用。","practice":"用虚构客服主管场景写一张今日结果卡：用户、流程瓶颈、输出、正常/失败验收。","expected":"结果卡明确‘主管需要决策依据’，而不是笼统写‘做 Python 脚本’。","failure":"把输出写成‘完成脚本’时重写一次，直到指向用户决策。","transfer":"给 Job Agent 和华丰各标注当前最强、最弱的一个 4C 面。","gate":"能用 90 秒区分 FDE、售前、交付、PM、SWE 的最终责任。","day":1},{"title":"跑通 8 条虚构工单的最小闭环","why":"零基础先获得一次真实运行和验收体验。","standard":"固定答案：总工单 8、已解决 7、有效时长 5、平均 78.0 分钟、数据警告 2。","practice":"进入 FDE/00-最小案例，运行分析脚本并打开 output/report.md。","expected":"终端输出报告路径、5 条有效时长和 2 条警告；报告数字与固定答案一致。","failure":"删除 output/report.md 后复跑，确认系统能恢复生成。","transfer":"在 Job Agent 中只找一条‘输入→处理→输出’链，不要求今天改代码。","gate":"保存命令、终端末两行、报告路径和六项验收结果。","day":2},{"title":"看懂数据流，不背代码","why":"FDE 要能解释系统怎样产生结果，Vibe Coding 也不能跳过理解。","standard":"数据流为 tickets.csv→逐行读取→校验→统计→report.md；四个入口是 load_tickets、calculate_resolution_minutes、build_report、main。","practice":"逐个函数写输入、输出和调用方向，再手工抽查一条工单时长。","expected":"能指出函数边界，并人工算出至少一条记录与报告一致。","failure":"把一个函数名遮住，仅根据输入输出判断它负责哪一步。","transfer":"在 Job Agent 选一个页面，记录它提交的输入和最终显示的输出。","gate":"不看页面能画出最小案例数据流并说出两个坏数据去向。","day":3},{"title":"先写验收，再做 10 分钟改动","why":"避免让 AI 用‘代码写完了’代替结果验证。","standard":"高优先级工单占比应为 37.5%（3/8）；分子、分母和显示格式必须明确。","practice":"先记录预期值，再让 AI 协助增加高优先级占比，运行并核对。","expected":"报告新增 37.5%（3/8），原有 8/7/5/78.0/2 不退化。","failure":"故意把分母改成 resolved 数量，观察为什么会得到错误口径。","transfer":"给 Job Agent 写一个未来小改动的‘修改前验收值’，暂不执行。","gate":"保留修改位置、diff、运行结果和人工计算。","day":4},{"title":"故意失败一次：坏输入与可恢复性","why":"现场数据不会像 Demo 数据一样干净。","standard":"坏数据应被隔离、记录并允许其余数据继续处理；未知字段、空值和非法日期要有明确策略。","practice":"增加一条非法日期、一条缺失时间，再运行并核对警告；恢复原数据后复跑。","expected":"任务不中断，警告数按输入变化，恢复后基线回到固定答案。","failure":"临时移走输入文件，记录完整报错，再说明更友好的错误提示应是什么。","transfer":"列 Job Agent 的两个输入失败：空 JD、格式不稳定或证据缺失。","gate":"能说明止损、保留现场、恢复三步，不只会说‘重试’。","day":5},{"title":"十步闭环与相邻岗位边界","why":"知道一个小脚本在真实交付中只覆盖哪几步。","standard":"十步是场景选择、Discovery、技术定界、架构、原型、Eval、生产化、采用、产品化、商业扩展。","practice":"把工单案例贴到十步图上，标已做、假设和缺失。","expected":"明确当前只验证数据处理原型和人工校准，尚无生产采用。","failure":"把‘报告生成成功’误写成‘业务价值实现’，再指出缺少哪些证据。","transfer":"分别标 Job Agent 与华丰当前能支持到哪一步，不能把目标方案当现状。","gate":"能说出第 9/10 步为何是 FDE 与一次性外包的分水岭。","day":6},{"title":"第一次交付演示与八维基线","why":"用演示检验是否真正理解，而非完成文件数量。","standard":"八维评分必须绑定证据：基础工程、AI 应用、企业集成、Eval、Discovery、沟通、产品判断、端到端交付。","practice":"做 5 分钟演示：客户问题→运行→坏数据→改动→验收→4C；完成 1–4 级能力基线。","expected":"演示包含一次真实命令和一次失败路径，不以幻灯片替代运行。","failure":"让听众随机追问一个数字或函数；不知道时现场定位，不编答案。","transfer":"只给 Job Agent/华丰已有证据打分；无证据记 1，不用自我感觉加分。","gate":"交付周复盘：本周产物、可复现证据、三个问题和下周唯一目标。","day":7},{"title":"识别用户、买单者、系统 Owner 与阻碍者","why":"同一句客户诉求背后有不同角色和成功标准。","standard":"至少区分终端用户、业务负责人、买单者、数据/系统 Owner、IT/安全/合规和 Sponsor。","practice":"为虚构客服团队画 Stakeholder Map，并写每个角色最怕什么。","expected":"图中至少有 5 类角色、决策权、输入和潜在阻力。","failure":"加入一个‘使用者支持但 IT 反对’事件，说明下一步。","transfer":"迁移到华丰，只使用脱敏角色类型，不推断具体个人立场。","gate":"能解释谁使用、谁批准、谁能阻断和谁承担失败成本。","day":8},{"title":"画 As-Is，而不是直接画架构","why":"真实瓶颈通常藏在交接、等待和数据重录里。","standard":"As-Is 要包含角色、步骤、输入输出、系统、等待、返工、异常和决策点。","practice":"画客服工单从进入到关闭的现流程，标三个摩擦点。","expected":"流程图能让非技术人员指出哪里慢、贵、易错。","failure":"删掉一个关键系统访问权限，重画受影响路径。","transfer":"画 Job Agent 从看到 JD 到决定投递的现流程，暂不写解决方案。","gate":"10 分钟白板能讲清当前流程和最痛断点。","day":9},{"title":"事实、客户主张、假设与未知","why":"FDE 的判断必须知道自己依据什么。","standard":"事实有来源；主张由角色提出但未必为真；假设可验证；未知需要 Owner 和验证动作。","practice":"把一组虚构访谈记录分成四栏，并为每个未知写验证方式。","expected":"每一行有来源/提出者、状态和下一步。","failure":"客户说‘每天浪费两小时’时，不直接写成事实，先设计测量。","transfer":"用同一模板整理华丰：最新阶段事实与历史方案表述分开。","gate":"随机抽 5 条，90 秒内说清类别、来源和验证动作。","day":10},{"title":"成功指标、基线与失败成本","why":"没有基线就无法证明方案改变了业务。","standard":"指标分业务结果、系统质量、用户采用；每个指标需口径、基线、目标、数据源、Owner 和误读方式。","practice":"为客服助手写 AHT、引用正确率、采纳率三层指标卡。","expected":"三个指标分别对应业务、系统和采用，不能用模型分数冒充业务价值。","failure":"在没有历史基线时，只设计测量流程，不编目标提升百分比。","transfer":"为 Job Agent 写‘待验证用户价值’，为华丰写 Gate 0 测量建议。","gate":"能回答失败一次会造成什么、谁承担和何时必须人工接管。","day":11},{"title":"Scope：必须做、不做、依赖与停止条件","why":"客户原始愿望必须被切成可上线的最小业务闭环。","standard":"薄切片包含一个目标用户、一段闭环、数据、人工边界、Demo、验收和停止条件。","practice":"把‘自动回复所有客户’缩成‘带引用草稿→人工审核→反馈’。","expected":"明确不直接发送、不做全量 CRM、不训练模型，并写依赖。","failure":"客户临时要求自动发送时，用风险和验证顺序控制变更。","transfer":"给 Job Agent 写一个最小决策助手闭环；华丰只写当前建议，非已确认范围。","gate":"每个功能能映射到用户结果或验收，否则删除。","day":12},{"title":"公开 API、JSON 与 HTTP","why":"把外部数据接进系统是企业集成的最小形态。","standard":"请求包含方法、URL、参数和头；响应包含状态码、头和 JSON/文本；失败不能静默吞掉。","practice":"调用一个无需密钥的公开 API，保存原始响应和清洗结果。","expected":"能解释 2xx/4xx/5xx 的责任差异和重试边界。","failure":"模拟超时、非 JSON 或字段缺失，记录处理策略。","transfer":"在 Job Agent 找一个 API 客户端调用，标请求/响应/错误路径。","gate":"输出数据字典、请求证据和至少一个失败响应。","day":13},{"title":"SQLite 与可复现 Solution Brief v0","why":"把发现结果和最小技术证据合成一页共同确认材料。","standard":"Solution Brief 包含问题、角色/流程、事实/未知、Scope/非目标、指标、依赖、风险、下一步。","practice":"将公开 API 清洗结果写入 SQLite，并把数据流写入 Brief。","expected":"数据库表有主键与字段说明；另一人按 README 可复现。","failure":"插入重复主键或缺字段，说明拒绝、修复或隔离选择。","transfer":"为 Job Agent/华丰各写一段迁移备注，标真实、参考、方案和待验证。","gate":"客户回放 5 分钟：先确认理解，再提出薄切片，不用架构名词压人。","day":14},{"title":"终端、路径、Git 与安全工作区","why":"可复现和可回滚先于写功能。","standard":"每次改动前确认目录、分支、diff 和启动方式；密钥只进环境，不进仓库。","practice":"初始化练习项目，做一次小提交和一次可恢复的错误修改。","expected":"能用 diff/log 找到变化并撤回自己刚做的小改动。","failure":"从错误目录运行，识别路径问题而非反复重装。","transfer":"只读查看 Job Agent 的 README、入口和 Git 历史，不改用户未授权文件。","gate":"交付安全操作清单和第一个可描述的提交。","day":15},{"title":"从业务状态设计数据模型","why":"表结构应服务工作流，而不是照着页面堆字段。","standard":"工单至少有 ID、类别、优先级、状态、创建/解决时间；状态转换需有规则。","practice":"设计 SQLite schema 和状态转换表。","expected":"能回答主键、必填、枚举和时间字段为何这样定。","failure":"尝试非法状态转换，定义错误而不是自动纠正。","transfer":"对照 Job Agent 的一个 Domain 对象，标业务含义与存储字段。","gate":"schema、样例数据和状态矩阵可以人工复核。","day":16},{"title":"FastAPI 新增与查询","why":"先完成最小读写闭环。","standard":"路由只负责协议与校验，业务规则进 Service，持久化进 Storage。","practice":"实现新增工单、单条查询和列表接口。","expected":"新增后能查询到；重复 ID 和不存在记录返回明确状态码。","failure":"发送缺字段和错误类型，保存错误响应。","transfer":"定位 Job Agent 一条 routes.py→service.py→storage.py 调用方向。","gate":"API 测试覆盖成功、重复和不存在三条路径。","day":17},{"title":"状态更新与统计接口","why":"FDE 交付的不是 CRUD 数量，而是业务状态可控。","standard":"更新需校验允许转换；统计口径要固定分母和时间范围。","practice":"实现更新状态与类别/优先级/平均耗时统计。","expected":"统计与人工抽查一致，非法转换不写入数据库。","failure":"并发或重复提交同一更新，观察幂等问题。","transfer":"找 Job Agent 一个状态变化，写出前置条件与副作用。","gate":"保存状态矩阵、请求/响应和数据库抽查。","day":18},{"title":"错误、日志与环境变量","why":"现场排障需要可定位而不泄密。","standard":"日志记录请求/任务 ID、阶段、错误类型和耗时，不记录密钥或敏感正文。","practice":"为 API 增加结构化日志、配置检查和统一错误响应。","expected":"一次失败能从日志定位到请求和阶段。","failure":"移除必要配置，确认启动时快速失败并给明确提示。","transfer":"检查 Job Agent 的日志/配置入口，列两个安全边界。","gate":"错误演练记录包含触发、观察、根因、修复和恢复。","day":19},{"title":"自动化 API 测试","why":"回归证据比‘我点过一次’可靠。","standard":"测试覆盖正常、边界、错误和状态副作用；测试数量不是价值本身。","practice":"为四类接口写至少 8 个测试并实际运行。","expected":"测试全绿且能解释每个测试保护什么业务规则。","failure":"故意改坏一个期望，读失败后恢复。","transfer":"在 Job Agent 只选与本周链路相关的测试阅读，不背全量数字。","gate":"保留命令、退出码、失败截图/文本与恢复结果。","day":20},{"title":"API 周演示与 Scope 复核","why":"技术增量必须回到客户问题。","standard":"演示顺序：问题→Scope→正常路径→失败路径→日志/测试→仍未解决。","practice":"完成 8 分钟演示并让听众提出一个范围变更。","expected":"能说明哪些请求现在拒绝、延后或进入路线图。","failure":"模拟数据库只读或不可用，给有限服务/停止建议。","transfer":"比较工单 API 与 Job Agent 链路的共同分层和不同风险。","gate":"周 Gate 由可运行系统、测试、失败记录和 Scope 复核共同通过。","day":21},{"title":"给工单 API 加最小操作界面","why":"用户价值必须进入工作流，而非停在接口文档。","standard":"界面只覆盖核心闭环和错误反馈，不追求视觉功能堆叠。","practice":"实现列表、新增、更新状态和统计视图。","expected":"用户能完成一条工单闭环，错误输入有可理解提示。","failure":"后端返回 500 时，界面不能假装成功。","transfer":"观察 Job Agent 某页面的加载、提交、成功和失败状态。","gate":"保存一次完整操作录屏和错误状态截图。","day":22},{"title":"追踪页面→API→Service→Storage→页面","why":"代码可信度来自理解链路和影响范围。","standard":"每层写输入、输出、责任、失败和日志位置；不要把多个入口混成一个。","practice":"从一个按钮点击开始，逐层定位到数据库并返回页面。","expected":"链路图能指出文件/函数、数据形态和状态变化。","failure":"在 API 返回慢或字段变化时，预测哪一层先暴露问题。","transfer":"对 Job Agent 选一条真实链路做同样追踪。","gate":"不看图能口述五层和两个失败路径。","day":23},{"title":"健康检查、超时与可恢复错误","why":"生产化从可发现故障开始。","standard":"健康检查区分进程存活与依赖可用；超时、重试和用户反馈需分层。","practice":"加入健康检查和请求超时，模拟数据库异常。","expected":"系统明确显示不可用原因，不无限等待或吞错。","failure":"让健康检查误报为绿，说明为什么危险并修正。","transfer":"检查 Job Agent 的启动/健康/错误回退材料。","gate":"故障报告包含检测、影响、止损、恢复和预防。","day":24},{"title":"Docker 与配置边界","why":"客户环境差异会击穿‘我电脑上能跑’。","standard":"镜像包含运行依赖，不包含密钥/本地数据；配置从环境注入。","practice":"写 Dockerfile 和启动说明，在干净环境构建运行。","expected":"容器启动、健康检查、数据持久化和停止恢复可验证。","failure":"缺少环境变量或端口冲突时给明确处理。","transfer":"对照 Job Agent 本地 App/DMG 与容器部署的不同边界。","gate":"交付构建日志、启动命令、已知限制和失败恢复。","day":25},{"title":"全栈自动化与一次小改动","why":"Vibe Coding 的最低标准是能验证 AI 修改没有破坏闭环。","standard":"小改动先写验收，运行相关测试，再人工抽查关键路径。","practice":"增加一个筛选或状态提示，写 5+ 相关自动化测试。","expected":"新功能通过且原核心路径无退化。","failure":"故意修改 API 字段名，观察前后端契约失败并恢复。","transfer":"在 Job Agent 选择低风险小改动候选，只在授权范围内执行。","gate":"保存验收前预测、diff、测试和手工结果。","day":26},{"title":"冷启动与交接 README","why":"真正可交付的系统不能依赖作者口头救场。","standard":"README 包含环境、输入、配置、启动、验证、故障、清理和已知限制。","practice":"在新目录/新终端按 README 从零启动。","expected":"另一人或全新会话能在 15 分钟内得到首个结果。","failure":"故意漏掉一步，让复现者记录阻塞并修正文档。","transfer":"审计 Job Agent README 哪些是系统事实、哪些是目标描述。","gate":"提交冷启动时长、阻塞清单与修订后的 README。","day":27},{"title":"全栈 Gate 与 Job Agent 技术迁移","why":"把绿地练习迁移到棕地系统，检验真实理解。","standard":"迁移不是背目录，而是用同一问题框架追踪输入输出、状态、副作用、测试与失败。","practice":"完成工单系统演示，再画 Job Agent 一条真实链路和两个失败路径。","expected":"能区分‘我读懂/复现/修改/验证’四种所有权强度。","failure":"随机更换入口，判断哪些层复用、哪些需重新定位。","transfer":"更新 Job Agent 学习记录，不把仓库全量测试写成个人成果。","gate":"两条链路均能在 5 分钟内讲清且证据位置可查。","day":28},{"title":"定义知识助手的用户结果与非目标","why":"先避免把主线项目做成泛化 Chatbot。","standard":"目标是给客服生成带引用草稿并由人审核；不直接发送、不替代合规终局判断。","practice":"用虚构 B2B SaaS 文档写用户旅程、MVP 和不做清单。","expected":"一个目标用户、一段闭环、三类指标和风险闸门清楚。","failure":"客户要求‘自动回答所有问题’时给降风险替代。","transfer":"对比 Job Agent 的‘决策助手、不自动投递’边界。","gate":"Solution Brief v1 通过 Context/Scope Gate。","day":29},{"title":"文档解析、清洗与版本","why":"垃圾输入会直接污染检索和回答。","standard":"文档需来源、版本、权限、更新时间、解析状态和内容哈希。","practice":"创建公开/虚构文档集，解析并输出清洗报告。","expected":"能发现空文档、乱码、重复和过期版本。","failure":"加入相互冲突文档并制定新鲜度策略。","transfer":"把 Job Agent 的证据来源版本化思路迁移到文档元数据。","gate":"数据清单含 Owner、许可、版本和质量问题。","day":30},{"title":"Chunk 与 Embedding 实验","why":"切分是检索质量的产品取舍。","standard":"chunk 需保留上下文、来源和权限元数据；大小/重叠影响召回、噪声、延迟和成本。","practice":"选两种 chunk 策略，用同一问题比较检索结果。","expected":"报告不是只列分数，而是说明命中、噪声和引用完整性。","failure":"加入跨段答案，观察过小 chunk 的失败。","transfer":"对比 Job Agent 固定证据片段与 RAG chunk 的差异。","gate":"保存参数、样例、结果和选择理由。","day":31},{"title":"检索、Rerank 与可解释结果","why":"模型回答前先验证找到的证据。","standard":"检索与生成分开观察；top-k、阈值、rerank 和过滤均需版本化。","practice":"实现检索并展示候选文档、得分、来源和耗时。","expected":"至少一个问题能人工确认正确片段排在前列。","failure":"使用模糊问题，记录召回多但排序错的案例。","transfer":"把 Job Agent strong/partial/gap 的可解释思想迁移到检索结果呈现。","gate":"检索演示能说明为什么选这些证据。","day":32},{"title":"带引用回答与无依据拒答","why":"可信 AI 的底线是不能把流畅文本当事实。","standard":"回答每个关键主张绑定来源；证据不足、冲突或过期时拒答/升级人工。","practice":"实现回答、引用和拒答，并人工核对引用。","expected":"引用定位到原文；无答案问题不编造。","failure":"删除关键文档后复问，确认系统不会沿用旧答案。","transfer":"对照 Job Agent ‘生成内容必须引用已确认事实’的守卫。","gate":"通过有答案、无答案、冲突三类手工 Gate。","day":33},{"title":"用户反馈与编辑痕迹","why":"系统是否有用要看用户怎样采用、修改或拒绝。","standard":"反馈至少记录采用/编辑/拒绝、原因、版本和角色，不把点赞等同业务价值。","practice":"增加反馈动作和最终草稿差异记录。","expected":"一次完整交互能追踪从检索到用户决定。","failure":"用户拒绝但不填原因时，设计低负担补充方式。","transfer":"为 Job Agent 设计‘用户纠正 unknown/gap’反馈，不声称已有采用数据。","gate":"日志可回答用户为何不用，而不泄露敏感正文。","day":34},{"title":"RAG v0 演示与边界复盘","why":"把功能组合成可验收业务闭环。","standard":"演示同时覆盖用户结果、系统质量和人机边界。","practice":"完成 10 分钟演示：正常回答、拒答、冲突文档、反馈。","expected":"四条路径均有可复核输入输出和版本。","failure":"模型不可用时展示确定性回退或明确不可用。","transfer":"写 Job Agent 与知识助手的 AI 边界对比表。","gate":"交付 v0、演示记录、Bad Case 列表和 Week 6 最低目标。","day":35},{"title":"角色、资源与动作权限矩阵","why":"企业 AI 首先是身份与数据边界问题。","standard":"权限要定义主体、资源、动作、条件和审计，不只定义页面可见。","practice":"为客服、主管、合规、管理员写权限矩阵。","expected":"每个角色能/不能看什么、做什么有明确原因。","failure":"加入跨部门临时授权和到期回收。","transfer":"把华丰角色/数据边界转成待确认假设，不使用真实敏感字段。","gate":"矩阵覆盖允许、拒绝、审批和审计。","day":36},{"title":"检索前 metadata 权限过滤","why":"生成后再遮挡已经发生了越权泄露。","standard":"权限过滤必须在候选文档进入模型前执行，并保留拒绝审计。","practice":"实现角色过滤，比较同一问题在不同角色下的候选片段。","expected":"越权内容不进入检索上下文，结果差异可解释。","failure":"伪造前端角色参数，确认后端仍拒绝。","transfer":"检查 Job Agent 的本地单用户边界为何不能直接证明企业多租户。","gate":"保存两角色对比和一次攻击失败证据。","day":37},{"title":"提示注入、恶意文档与数据泄漏","why":"RAG 文档本身也可能是不可信输入。","standard":"系统指令、文档内容、用户请求和工具权限分层；敏感动作必须有确定性守卫。","practice":"加入一份恶意文档和越权诱导，记录系统行为。","expected":"恶意指令不改变权限或泄露隐藏内容。","failure":"让恶意文档要求忽略引用，验证引用守卫。","transfer":"对照 Job Agent 不可信 JD/网页采集的 Source Adapter 边界。","gate":"建立注入/泄漏 Bad Case 分类与处理动作。","day":38},{"title":"Hybrid Search 与 Rerank 取舍","why":"企业术语、编号和语义问题常需混合检索。","standard":"关键词擅长精确实体，向量擅长语义；rerank 提升排序但增加延迟/成本。","practice":"用编号、简称和自然语言三类问题比较策略。","expected":"报告包含命中、延迟、成本和失败样例。","failure":"降低召回阈值观察噪声如何伤害回答。","transfer":"在 Job Agent 区分确定性过滤与模型/语义增强。","gate":"选择策略有数据和推翻条件，不以工具流行度决定。","day":39},{"title":"反馈、日志与隐私最小化","why":"可观测不等于把全部用户数据写日志。","standard":"日志只保留定位与评估所需字段，敏感内容脱敏/哈希并设保留策略。","practice":"定义事件 schema，记录检索、回答、反馈、权限拒绝和耗时。","expected":"能从事件重建一次流程但看不到不必要的敏感正文。","failure":"模拟日志系统失败，决定是否阻断高风险操作。","transfer":"审计 Job Agent 哪些本地数据属于个人隐私。","gate":"输出数据最小化表、保留周期和删除动作。","day":40},{"title":"权限与集成自动化测试","why":"权限安全不能靠手点一次。","standard":"测试覆盖角色允许/拒绝、伪造身份、文档变权、注入和日志泄漏。","practice":"写并运行至少 12 个权限/安全测试。","expected":"越权为零；失败测试能定位到过滤层。","failure":"故意把过滤移到生成后，观察测试如何捕获。","transfer":"为华丰方案列出未来必须由客户 IT/安全验证的接口 Gate。","gate":"保存测试清单、结果和残余风险。","day":41},{"title":"企业原型 Gate 与安全回放","why":"用客户能理解的方式证明安全与可用。","standard":"回放先说明角色/风险，再演示允许、拒绝、审计和恢复。","practice":"完成两角色 Demo、攻击失败和权限变化回放。","expected":"客户能回答‘谁能看、谁批准、失败留下什么记录’。","failure":"临时撤销主管权限，展示数据和缓存如何处理。","transfer":"将华丰当前只写为权限/数据契约建议，非已接入。","gate":"交付权限感知 RAG v1 和 Week 6 安全报告。","day":42},{"title":"定义 What Good Looks Like","why":"没有 Rubric，评估只剩个人感觉。","standard":"分开检索、回答、权限/安全、系统质量、业务结果和采用。","practice":"为知识助手写分层 Rubric 和不可接受错误。","expected":"高风险子集、责任人和失败动作明确。","failure":"给流畅但无引用回答高分，再用 Rubric 纠正。","transfer":"对照 Job Agent strong/partial/gap 与用户价值的不同层次。","gate":"Rubric 可供第二个人独立评分并得到近似结论。","day":43},{"title":"构建 30+ Golden Cases","why":"评测集必须代表真实风险而非只测简单正确题。","standard":"至少覆盖有答案、无答案、角色差异、越权、注入、歧义和冲突/过期文档。","practice":"建立 30+ cases，记录输入、角色、期望证据、期望动作和风险级别。","expected":"类别数量达到计划且每条可人工复核。","failure":"删除一类高风险题，观察总体分数为何会虚高。","transfer":"Job Agent 19 条语料作为固定基线，扩展项另起版本。","gate":"评测集有版本、来源、分层覆盖和变更记录。","day":44},{"title":"检索与回答分层评估","why":"回答错可能是没检到、排错或生成错。","standard":"先评检索命中/排序，再评引用与回答，才能定位改进点。","practice":"运行基线并给每个失败贴层级标签。","expected":"报告能区分 retrieval、rerank、generation、permission 与 data 问题。","failure":"让模型回答更保守，观察拒答与覆盖的取舍。","transfer":"把方法迁移到 Job Agent 证据匹配失败分类。","gate":"至少复盘 5 个 Bad Case 的根因与修复候选。","day":45},{"title":"延迟、成本与稳定性日志","why":"质量达标但太慢、太贵或不稳定仍不能上线。","standard":"记录端到端及阶段耗时、token/成本、超时、错误率和重试。","practice":"为同一评测批次生成质量/延迟/成本联合报告。","expected":"能识别 P95 慢点与成本主要来源。","failure":"模拟模型超时和限流，记录用户体验与回退。","transfer":"检查 Job Agent 模型默认可关闭如何降低单点依赖。","gate":"提出一个优化并说明可能伤害的指标。","day":46},{"title":"版本化回归实验","why":"每次改 Prompt/检索/模型都可能让别的子集退化。","standard":"一次实验只明确改变项、假设、版本、结果和回滚条件。","practice":"改变一个 chunk/top-k/rerank 参数，跑同一 30+ 集。","expected":"报告列总体、分组、退化案例和选择建议。","failure":"只看总体提升做 Go，再用高风险子集否决一次。","transfer":"在 Job Agent 选择一个规则变更，先写回归假设。","gate":"能给 Go/Limited Go/No-Go 而非只报分数。","day":47},{"title":"上线、回滚与人工复核 Gate","why":"Eval 的产物是决策，不是图表。","standard":"Gate 包含阈值、样本、负责人、人工复核、失败动作和回滚版本。","practice":"为知识助手写上线/回滚卡。","expected":"质量、权限、延迟、成本、稳定性至少覆盖四类。","failure":"当一个高风险越权 case 失败时，即使总体高分也触发 No-Go。","transfer":"华丰只设计未来 Eval Gate，不填虚构结果。","gate":"每个 Gate 都能回答谁看、何时看、失败做什么。","day":48},{"title":"Eval 周答辩与独立复核","why":"让别人重复你的评估，避免自证成功。","standard":"独立复核包括相同版本、数据、命令、Rubric 和差异解释。","practice":"请另一人或新会话复评 5 条，比较分歧。","expected":"分歧有记录并推动 Rubric/样例更清晰。","failure":"随机替换一个 case 期望，观察版本控制能否发现。","transfer":"明确 Job Agent 工程基线不等于真实用户采用。","gate":"交付基线报告、实验报告、Gate 和复核差异。","day":49},{"title":"选择 Workflow、Agent 或规则","why":"不要为了 Agent 而 Agent。","standard":"稳定步骤用 Workflow/规则；不确定选择才考虑 Agent；高风险动作加人工闸门。","practice":"把客服处理拆成确定步骤和不确定判断。","expected":"每一步写选择、替代方案、成本和推翻条件。","failure":"将所有步骤交给自主 Agent，再指出不可控点。","transfer":"对照 Job Agent 的确定性工作流和模型增强边界。","gate":"选型 Memo 能回答为什么不用更复杂方案。","day":50},{"title":"结构化输出与工具契约","why":"工具调用首先是 API 契约，不是提示词魔法。","standard":"schema 定义字段、类型、必填、错误和幂等键；模型输出必须校验。","practice":"定义 classify、retrieve、draft 三个工具契约。","expected":"合法输出通过，缺字段/未知枚举被拒绝或修复。","failure":"让模型返回额外字段和错误类型，观察校验。","transfer":"在 Job Agent 找一个任务输入/输出 schema 对照。","gate":"保存契约、校验测试和错误样例。","day":51},{"title":"状态机与可恢复执行","why":"多步 Agent 需要知道现在在哪、能去哪里。","standard":"状态包括当前阶段、输入、输出、尝试次数、审批和终止原因。","practice":"画并实现工单草稿状态机。","expected":"正常、失败、取消和恢复路径可演示。","failure":"在中间步骤崩溃，重启后从安全状态恢复。","transfer":"对照 Job Agent 持久任务/状态，标参考与个人理解。","gate":"状态图、存储记录和实际 Trace 一致。","day":52},{"title":"幂等、重试与超时","why":"重复执行在现场会发送两次、写两次或收费两次。","standard":"重试只用于可恢复错误；副作用需幂等键；设上限、退避和超时。","practice":"为工具调用加入幂等键、重试上限和超时。","expected":"重复请求只产生一次副作用；永久错误不反复重试。","failure":"模拟超时后晚到响应，确认不会覆盖新状态。","transfer":"解释 Job Agent 租约/重试如何降低重复副作用。","gate":"通过重复、暂时失败、永久失败、超时四类测试。","day":53},{"title":"只生成草稿，不直接执行高风险动作","why":"先把 AI 放在可逆、可审核的位置。","standard":"模型可建议/草拟；发送、承诺、删除、付款等需要确定性规则或审批。","practice":"实现检索后生成回复草稿和下一步建议。","expected":"系统不具备直接发送能力，草稿带依据和风险提示。","failure":"让模型要求绕过审批，确认工具层拒绝。","transfer":"对照 Job Agent 不自动投递的产品边界。","gate":"能说明哪些动作可自动、需审批或必须人工。","day":54},{"title":"Trace Viewer 与失败分类","why":"排障需要重放每一步，而不是只看最终回答。","standard":"Trace 记录 step、输入摘要、输出、版本、耗时、错误和状态变化。","practice":"实现或输出可读 Trace，演示一次成功一次失败。","expected":"能从 Trace 定位失败层并重放安全步骤。","failure":"移除一个 Trace 字段，判断是否仍可审计。","transfer":"对照 Job Agent 测试/日志证据与产品用户可见解释。","gate":"建立工具、数据、模型、权限、状态五类失败表。","day":55},{"title":"Agent v0 Gate 与现场变化","why":"用突发条件检验系统是否受控。","standard":"现场变化要改变范围、策略或升级路径，而不是继续原计划。","practice":"演练数据不可用、模型变差、工具限流三种变化。","expected":"每种变化有止损、人工接管、恢复和沟通。","failure":"关键工具返回成功但数据错误，说明为何状态码不够。","transfer":"把三类变化迁移到 Job Agent 的求职任务工作流。","gate":"交付 Agent v0、Trace、失败表和变化决策记录。","day":56},{"title":"动作风险分级与人工闸门","why":"不是所有工具调用都需要相同控制。","standard":"按可逆性、影响范围、外部承诺、隐私和金额分级，并绑定审批策略。","practice":"给客服 Agent 动作分低/中/高风险。","expected":"每级有允许、审批、禁止和升级规则。","failure":"加入一个看似低风险但会泄露数据的动作并重新分级。","transfer":"给 Job Agent 的生成、导出、投递候选动作分级。","gate":"风险矩阵经反例仍能稳定判断。","day":57},{"title":"审批队列与责任人","why":"人工闸门必须知道谁在何时看什么。","standard":"审批项需上下文、证据、建议、风险、过期时间、允许动作和审计 ID。","practice":"实现审批队列和批准路径。","expected":"批准后只执行获批版本，过期审批不能复用。","failure":"审批期间草稿改变，确认旧批准失效。","transfer":"华丰方案写业务/IT/安全不同审批责任，不写已确认。","gate":"审批记录能回答谁、何时、基于什么做决定。","day":58},{"title":"拒绝、修改与终止","why":"HITL 不是只有一个‘同意’按钮。","standard":"拒绝要有原因与下一步；修改产生新版本；终止清理资源并保留审计。","practice":"实现拒绝、编辑后重审和终止。","expected":"三条路径状态、版本和日志一致。","failure":"拒绝后重复回调，确认不会重新执行。","transfer":"给 Job Agent 的人工确认设计撤销/修订路径。","gate":"演示三条路径并解释业务含义。","day":59},{"title":"审计日志与最小敏感信息","why":"可追责与隐私必须同时满足。","standard":"审计记录身份、动作、对象、版本、结果和理由；敏感正文按需引用而非全量复制。","practice":"设计审计 schema 并记录一次完整审批。","expected":"能重建决策链，日志不暴露不必要正文。","failure":"模拟日志不可用，决定高风险动作是否停止。","transfer":"对照华丰未来审计需求与当前无生产数据事实。","gate":"通过可追溯与数据最小化双 Gate。","day":60},{"title":"五类必演失败","why":"生产可信度来自失败时的行为。","standard":"最低覆盖批准、拒绝、工具失败、超时、无权限；另加重复请求。","practice":"逐条故障注入并保存 Trace。","expected":"每条有明确用户状态、恢复/升级和无重复副作用。","failure":"同时触发超时与撤销，验证竞态处理。","transfer":"映射 Job Agent 可观察的故障与仍缺失的证据。","gate":"五条路径均能现场复现，不只写文档。","day":61},{"title":"20+ Agent Eval Cases","why":"工作流回归需覆盖状态与副作用，不只是文本质量。","standard":"case 包含前置状态、事件、预期工具/状态/审批/副作用和风险。","practice":"建立并运行 20+ cases。","expected":"正常、异常、权限、审批和重复执行均有覆盖。","failure":"删去副作用断言，观察假阳性如何出现。","transfer":"对照 Job Agent 测试只作为系统证据，不自动算个人编写。","gate":"报告列失败根因、回滚判断和残余风险。","day":62},{"title":"HITL 周答辩与恢复演练","why":"把安全机制讲成用户与业务结果。","standard":"说明人工闸门如何降低失败成本，同时控制延迟和人工负担。","practice":"演示五条路径并回答‘为什么不全自动’。","expected":"能量化至少一种人工负担指标和优化方向。","failure":"Sponsor 要求取消审批提速时，给分阶段证据方案。","transfer":"把人机边界迁移到华丰高风险质量决策。","gate":"交付受控 Agent v1、测试、审计和答辩记录。","day":63},{"title":"场景选择：不是所有需求都值得做","why":"十步闭环的起点是选择，不是接单。","standard":"评估影响、频率、数据可用、Sponsor、风险、可验证性和产品化潜力。","practice":"比较设备维修、合同审查和客服助手三个虚构场景。","expected":"给出选择/暂缓/拒绝及证据缺口。","failure":"高影响场景但无数据 Owner 时，设计最小验证而非直接开工。","transfer":"用同一框架回看华丰候选闭环，不改变 Gate 0 事实。","gate":"选择 Memo 包含替代方案和推翻条件。","day":64},{"title":"准备 45 分钟发现会","why":"好问题来自要做的决策，而不是问题数量。","standard":"问题覆盖目标、As-Is、角色、数据、权限、失败、指标、采用、依赖和时间。","practice":"为设备维修助手写发现会脚本和记录模板。","expected":"15 个问题均说明回答会影响哪个决策。","failure":"客户只给模糊答案时，用样例/观察/数据请求继续。","transfer":"比较华丰已有材料覆盖了哪些问题、哪些仍未知。","gate":"发现会提纲不包含诱导客户接受预设方案。","day":65},{"title":"执行发现会并主动推翻假设","why":"真正的 Discovery 必须允许原判断被改变。","standard":"记录原话/观察、假设、冲突和待办；会中回放理解，不急于给方案。","practice":"角色扮演 45 分钟并记录至少一个被推翻假设。","expected":"会后事实/假设/未知和责任人清楚。","failure":"关键人否认原痛点时，重新定义问题或 No-Go。","transfer":"华丰只能复盘历史材料，不伪造新客户回答。","gate":"录音/记录显示提问导致了范围或指标变化。","day":66},{"title":"As-Is、数据与权限现场图","why":"客户叙述需要转换成共同可确认的工作流。","standard":"图含角色、系统、数据对象、状态、交接、异常、权限和等待。","practice":"画设备维修 As-Is 与数据流。","expected":"客户能指出图中错误并完成一次修订。","failure":"加入 OT/IT 隔离，调整数据接入和人机边界。","transfer":"迁移到华丰来料异常流程，只用脱敏业务对象。","gate":"图中事实、推断、未知使用不同标记。","day":67},{"title":"Scope、非目标与停止条件","why":"范围控制是对结果负责，不是拒绝客户。","standard":"MVP 对准一个瓶颈，写必须做、不做、依赖、验收、停止和变更机制。","practice":"产出设备维修 Solution Brief。","expected":"每项能力能映射到结果和验证；Agent 不直接控制安全产线。","failure":"数据不可用时把方案缩为诊断建议/记录辅助。","transfer":"为华丰写 Gate 0 建议版 Scope，显著标方案未确认。","gate":"10 分钟内解释为什么这样切而不是更大。","day":68},{"title":"客户回放与异议处理","why":"共同确认比漂亮方案更重要。","standard":"回放顺序是理解→未知→取舍→风险→下一步，不假装所有问题已解决。","practice":"做 15 分钟客户回放，处理业务、IT/安全、使用者三类异议。","expected":"每个异议转成决定、验证或 Owner。","failure":"关键用户反对采用时，调整试点和工作流而非只做培训。","transfer":"练华丰‘为什么不重做 QMS、为什么先小闭环’。","gate":"回放记录包含客户修正和下一步，不只有自我陈述。","day":69},{"title":"Discovery Gate 与所有权复盘","why":"把方法能力和真实经历边界同时守住。","standard":"陌生模拟证明方法；华丰证明参与过的 Context；二者不能互相冒充。","practice":"对两套材料做 Context/Scope Rubric 评分。","expected":"陌生场景标模拟；华丰标 Gate 0、本人动作和未验证项。","failure":"随机抽一句强表述，降级到证据支持强度。","transfer":"更新华丰所有权账本的待确认项，不补写记不清的经历。","gate":"交付两套 Discovery 包和一页差异复盘。","day":70},{"title":"To-Be 流程与人机边界","why":"新流程必须真的改变工作，而不是叠加一个聊天框。","standard":"To-Be 标自动、人工、审批、异常、回退和状态回写。","practice":"画设备维修/知识助手目标流程。","expected":"每一步有角色、系统、输入输出和退出条件。","failure":"模型不可用时流程仍有人工/确定性退路。","transfer":"为华丰画建议版 To-Be，标未确认依赖。","gate":"As-Is 痛点与 To-Be 改变逐项对应。","day":71},{"title":"系统架构与数据流","why":"架构只为证明可行、风险和责任服务。","standard":"覆盖入口、身份、数据、检索/Agent、模型、Eval、日志和部署；标信任边界。","practice":"画主线项目架构和一条端到端数据流。","expected":"能指出敏感数据在哪、何时进入模型、如何删除。","failure":"模型或向量库替换时说明影响与验证。","transfer":"Job Agent 只引用实际代码链；华丰只做方案架构。","gate":"架构图可回答七个生产化问题。","day":72},{"title":"集成契约与依赖 Owner","why":"企业项目常死在接口、字段、网络和权限未就绪。","standard":"契约包含系统 Owner、接口、字段/主键、频率、权限、SLA、错误和变更。","practice":"为一个文档源/工单源写集成契约。","expected":"依赖有负责人、进入条件和替代方案。","failure":"接口只读或批量延迟时，调整 Scope 和体验。","transfer":"为华丰写脱敏数据供给契约建议，不声称已打通。","gate":"任何‘等客户提供’都转成具体 Owner、日期和失败动作。","day":73},{"title":"风险登记与安全评审","why":"风险必须有触发条件和应对责任人。","standard":"至少覆盖数据质量、越权、幻觉、注入、成本、延迟、不可用、采用和 Scope 膨胀。","practice":"完成风险表并按概率×影响排序。","expected":"Top 风险有预防、检测、触发、响应和 Owner。","failure":"加入 Sponsor 变化或合规暂停，重排计划。","transfer":"对华丰补 OT/IT、工业数据与质量决策人机边界。","gate":"能解释哪个风险会直接 No-Go。","day":74},{"title":"SLO、告警与事故 Runbook","why":"交付后必须有人知道什么时候系统坏了、怎么办。","standard":"SLO 关联用户体验；告警可操作；Runbook 含检测、止损、沟通、恢复和复盘。","practice":"定义可用性/延迟/错误/越权等 SLO 与一个 Runbook。","expected":"触发一次模拟事故并按 Runbook 恢复。","failure":"告警风暴时调整阈值而不掩盖真实故障。","transfer":"对照 Job Agent 本地形态与企业 SLO 的差距。","gate":"事故演练有时间线、影响、决策与改进项。","day":75},{"title":"RACI、变更控制与回滚","why":"模糊责任会在上线前后变成空档。","standard":"明确客户业务、IT/安全、FDE、产品/工程和 Sponsor 的 R/A/C/I；变更需影响评估。","practice":"完成 RACI、变更模板和回滚步骤。","expected":"每个关键动作有唯一 Accountable；回滚可操作。","failure":"负责人离场时重分责任并判断是否暂停。","transfer":"华丰明确本人非主讲、非交付 Owner。","gate":"随机一个变更能走完提出、评估、决定、验证、记录。","day":76},{"title":"生产就绪评审","why":"Demo 通过不等于可试点。","standard":"评审覆盖功能、数据、权限、安全、Eval、运维、培训、支持和回滚。","practice":"进行 Go/No-Go 评审并保留未决项。","expected":"只有有证据的条目通过；计划/脚本不冒充已验证。","failure":"发现一个权限高风险失败时执行 No-Go。","transfer":"Job Agent/华丰分别标当前真正能通过的 Gate。","gate":"交付生产化包和诚实的 Limited Go/No-Go 建议。","day":77},{"title":"试点基线与实验设计","why":"没有对照和口径，任何提升都可能是幻觉。","standard":"定义对象、周期、基线、样本、三层指标、成功/停止条件和偏差。","practice":"设计 10 名虚构客服/维修人员试点。","expected":"基线数据源和测量责任人明确。","failure":"没有真实基线时只做测量流程，不编提升值。","transfer":"Job Agent 用户价值仍标待验证；华丰仍是方案阶段。","gate":"试点章程可回答谁、多久、测什么、何时停。","day":78},{"title":"历史数据回放与质量观察","why":"回放能在低风险环境暴露数据和工作流问题。","standard":"回放保留版本、输入、预期、输出、人工判定和失败类型。","practice":"用虚构历史工单运行主线系统。","expected":"结果可重复，失败有分类和可追溯样例。","failure":"加入分布变化/过期文档，观察退化。","transfer":"用 Job Agent 固定语料理解离线回归，但不当作在线采用。","gate":"输出回放报告和最严重三个 Bad Case。","day":79},{"title":"试点培训、Champion 与反馈渠道","why":"采用不是发一封上线通知。","standard":"识别 Champion、培训需求、工作流嵌入、反馈入口、支持 SLA 和管理层节奏。","practice":"设计 30 分钟培训与一页操作指南。","expected":"用户知道何时信、何时查证、何时人工接管。","failure":"Champion 离开或用户抵触时调整试点。","transfer":"为华丰列潜在角色而非指定未经确认的人。","gate":"采用计划包含激励、阻力和实际下一动作。","day":80},{"title":"采用指标与人工负担","why":"高模型分不等于用户愿意用。","standard":"看草稿采纳率、编辑距离、拒绝原因、活跃、任务完成和人工接管。","practice":"为虚构试点生成/分析采用事件。","expected":"能区分没看到、不会用、不信任和确实无价值。","failure":"采纳率高但人工审查时间更长时重新判断。","transfer":"给 Job Agent 设计受控用户测试，不宣称尚未执行的结果。","gate":"指标卡含口径、基线、分群和误读方式。","day":81},{"title":"业务结果与替代解释","why":"结果变化可能来自季节、样本或流程变化。","standard":"同时列主解释、替代解释、所需证据和不能下的结论。","practice":"分析 AHT/响应时间等虚构前后数据。","expected":"结论强度不超过设计和样本支持。","failure":"总体改善但高风险类别变差时给 Limited Go。","transfer":"华丰不使用虚构 ROI；只写未来测量建议。","gate":"每个结论至少有一个替代解释和验证动作。","day":82},{"title":"Go、Limited Go、No-Go 与扩张条件","why":"FDE 对结果负责也包括敢于停止。","standard":"决策同时看业务、质量、采用、风险、成本和依赖；扩张需新的 Gate。","practice":"对试点做决策并写下一阶段范围。","expected":"建议包含证据、未决风险、Owner 和日期。","failure":"Sponsor 要求全量扩张时用分层 Gate 控制。","transfer":"Job Agent/华丰只在其真实阶段给建议。","gate":"能在 3 分钟内为 No-Go 辩护而不防御项目。","day":83},{"title":"10 分钟客户汇报与复盘","why":"客户需要的是决策，不是功能列表。","standard":"汇报结构：目标/基线→方案→结果→风险/局限→建议→下一步。","practice":"完成汇报和连续追问。","expected":"三层指标、采用阻力和 Go 决策清楚。","failure":"听众质疑样本和 ROI 时能降级结论。","transfer":"分别练模拟项目、Job Agent、华丰的真实性标签。","gate":"交付试点包、录音、问题清单和 Week 13 产品化输入。","day":84},{"title":"区分定制、可复用资产与应拒绝需求","why":"产品化是 FDE 与高级外包的分水岭。","standard":"每项现场需求归为客户特有、可配置模板、通用产品能力、SI 工作或应拒绝。","practice":"复盘 90 天产物并完成分类。","expected":"每个可复用项有适用边界和下一客户验证。","failure":"把所有定制都产品化，再识别维护成本和错误抽象。","transfer":"Job Agent 可看 Source Adapter/Domain Pack/Eval；华丰只提建议。","gate":"输出产品化阈值表和拒绝需求清单。","day":85},{"title":"沉淀连接器、权限、Eval 与 Workflow 模板","why":"Compounding 必须产生可复用的具体资产。","standard":"模板包含接口、配置、测试、适用范围、限制和版本。","practice":"整理至少四类可复用资产及复用说明。","expected":"新虚构客户能通过配置而非重写使用一部分。","failure":"换一个行业红线，检查模板是否错误泛化。","transfer":"只将本人实际理解/实现的资产标个人成果。","gate":"交付资产索引和一次跨场景复用演示。","day":86},{"title":"写 Field RFC 回流产品","why":"现场摩擦要变成产品与工程可决策的输入。","standard":"RFC 含问题、现场证据、受影响客户、当前 workaround、通用方案、风险、指标和推翻条件。","practice":"选择一个反复出现的权限/Eval/集成摩擦写 RFC。","expected":"产品/工程能据此决定做、试验、拒绝或继续收集。","failure":"只有一个客户出现时，标假设而非‘行业共性’。","transfer":"从 Job Agent/华丰分别找一个候选，证据不足就不升格。","gate":"完成 5 分钟 RFC 评审与修订。","day":87},{"title":"组装三类案例，不混淆证据","why":"作品集要展示迁移能力和真实性。","standard":"最小/虚构案例证明练习；Job Agent 证明技术理解/动作；华丰证明 Context/Scope 参与。","practice":"完成权限助手案例和 Job Agent/华丰两套 4C 叙事。","expected":"每篇含问题、所有权、选择、运行/验证、局限和下一步。","failure":"让审阅者随机指出一句，检查是否误把模拟/团队结果写成个人真实成果。","transfer":"统一所有权账本、事实卡与案例表述。","gate":"公开材料完成脱敏且没有受试者/客户原始数据。","day":88},{"title":"八维复评与陌生场景迁移测验","why":"最终检验不是熟悉项目，而是换场景仍能完成。","standard":"能力四级：能识别、能解释、能在项目完成、能在陌生变化中完成。","practice":"用新场景完成 60 分钟 Discovery→Scope→架构/Eval→Rollout 白板。","expected":"与 Week 1 八维基线逐项比较证据，不按自信评分。","failure":"中途加入数据不可用或关键人反对，必须改变方案。","transfer":"指出 Job Agent/华丰各补强哪些维度、仍缺哪些。","gate":"输出八维证据表和下一 90 天唯一补短主线。","day":89},{"title":"最终答辩与进入投递冲刺","why":"把能力证据转成求职材料，但不让表达领先事实。","standard":"最终答辩按 Context→Code→Calibration→Compounding，投递冲刺只负责简历、Mock 和申请。","practice":"完成 10 分钟 Demo、20 分钟追问、交付包索引和 14 天冲刺准备度检查。","expected":"系统可运行、失败可演示、评估可复跑、采用/局限可解释、产品化可展示。","failure":"被追问不常用数字时现场查证，不靠猜测维持流畅。","transfer":"事实档案只在表述/版本变化时更新，不再作为每日第一任务。","gate":"毕业：八维各有证据；未验证项明确；满足条件后进入 /ai-fde-14。","day":90}],"weeks":[{"week":1,"phase":"角色与最小闭环","subtitle":"先完成一次小交付，再理解 4C","abilities":["Context","基础工程","Calibration"],"deliverable":"可重复运行的工单报告、一次验收先行小改动、5 分钟演示与 4C 复盘。","stageGate":"不看教程能解释输入、处理、输出、坏数据和验证；报错时能提供命令、完整错误、预期与已尝试动作。","range":[1,7]},{"week":2,"phase":"Discovery、Scope 与数据基础","subtitle":"把 Context 前移，再补完成薄切片所需的最少技术","abilities":["Discovery","产品判断","数据基础"],"deliverable":"15 个发现问题、As-Is、事实/假设/未知、Solution Brief v0，以及公开 API→SQLite 小闭环。","stageGate":"能把‘做 AI 助手’缩成一个用户、一个流程瓶颈、一个薄切片和可复核验收，不先套技术方案。","range":[8,14]},{"week":3,"phase":"后端 API 与状态","subtitle":"把业务动作转成稳定接口","abilities":["基础工程","企业集成","调试"],"deliverable":"工单 CRUD/统计 API、SQLite 状态、校验、日志、环境边界和自动化测试。","stageGate":"新环境按 README 可启动；正常输入、非法状态、缺字段和不存在记录都有可预测响应。","range":[15,21]},{"week":4,"phase":"最小全栈与部署","subtitle":"证明能读、改、跑、验证，而非默写代码","abilities":["全栈闭环","部署","故障定位"],"deliverable":"可操作界面、完整调用链、健康检查、Docker、5+ 端到端测试和冷启动记录。","stageGate":"另一人只看 README 能启动；能追踪页面→API→Service→Storage→页面并解释两个失败路径。","range":[22,28]},{"week":5,"phase":"RAG 最小正确闭环","subtitle":"回答必须有依据，无依据必须拒答","abilities":["AI 应用","数据处理","引用溯源"],"deliverable":"权限感知知识助手 v0：文档→chunk→检索→回答→引用→拒答→反馈。","stageGate":"引用可定位原文；无依据问题明确拒答；能解释 chunk/top-k 改变带来的收益与代价。","range":[29,35]},{"week":6,"phase":"企业权限与集成","subtitle":"权限过滤必须发生在检索阶段","abilities":["企业集成","权限安全","用户反馈"],"deliverable":"两种以上角色、metadata 过滤、越权/注入测试、hybrid/rerank 和反馈日志。","stageGate":"越权测试零通过；引用能定位；权限不只写在 Prompt；日志与错误中不泄露敏感内容。","range":[36,42]},{"week":7,"phase":"Eval 与可观测","subtitle":"从看起来不错升级为可回归","abilities":["Calibration","指标","可观测"],"deliverable":"30+ Golden Cases、Rubric、失败分类、版本化回归、延迟/成本和上线/回滚 Gate。","stageGate":"修改策略后能用同一评测集解释变好、变差和取舍；不使用单一总体准确率掩盖高风险失败。","range":[43,49]},{"week":8,"phase":"Agent 与 Workflow","subtitle":"从问答升级到受控行动","abilities":["AI Workflow","状态","可靠性"],"deliverable":"工单分类→检索→草稿→建议下一步，包含工具调用、状态、幂等、重试、超时和 Trace。","stageGate":"工具失败不会无限重试或重复副作用；每次调用可追踪输入、输出、状态和错误。","range":[50,56]},{"week":9,"phase":"HITL、审计与高风险控制","subtitle":"批准、拒绝、修改、终止都要成为系统状态","abilities":["HITL","安全","审计"],"deliverable":"风险分级、审批队列、拒绝/修改/终止、审计日志与 20+ Agent 测试。","stageGate":"可演示批准、拒绝、工具失败、超时和无权限；高风险动作不能绕过人工。","range":[57,63]},{"week":10,"phase":"陌生场景 Discovery 与华丰迁移","subtitle":"先证明方法可迁移，再回看自己的项目","abilities":["客户发现","范围","沟通"],"deliverable":"设备维修 AI 助手发现会、As-Is、事实/假设/未知、Scope、客户回放；华丰迁移版。","stageGate":"能在新信息出现时改变判断；华丰严格区分最新事实、历史主张、方案建议、未知与本人所有权。","range":[64,70]},{"week":11,"phase":"生产化方案与责任边界","subtitle":"数据、权限、集成、风险、SLO、RACI 和回滚","abilities":["生产化","企业集成","交付管理"],"deliverable":"To-Be、架构、数据/权限、集成依赖、风险登记、RACI、SLO、Runbook 与 Rollback。","stageGate":"能回答数据从哪来、谁能看、怎样接入、失败怎么办、怎样观测、怎样停用恢复、谁负责。","range":[71,77]},{"week":12,"phase":"模拟试点、采用与结果判断","subtitle":"上线不等于价值，允许给 No-Go","abilities":["Adoption","业务指标","现场推进"],"deliverable":"虚构历史数据回放、试点计划、培训/反馈、三层指标、Go/Limited Go/No-Go 和客户汇报。","stageGate":"结论同时覆盖业务、系统质量和用户采用；模拟证据显著标注，不为项目成功强行解释结果。","range":[78,84]},{"week":13,"phase":"产品化、作品集与投递","subtitle":"把一次性交付变成下一次更快","abilities":["Compounding","产品判断","端到端交付"],"delivera 称‘我的项目’，并讲完整工作流和架构。","理解所有权：能解释模块、取舍和失败路径；这证明你理解系统，但不自动证明历史上由你原创。","能力所有权：能复现、修改、测试和迁移；这证明能力已经属于你。","动作归属：写清本人做出的决策、修改、实现或验证，以及导师、团队、参考系统和 AI 提供了什么。","区分这些层次不是限制你讲项目，而是让面试官同时看见系统理解、可迁移能力和真实贡献。"]},{"title":"项目阶段与公开表述红线","steps":["瞳孔仪 15/20 只称‘阶段可用输出率 75%’，不得称算法准确率或临床准确率。","华丰仍是 Gate 0 前方案阶段，不展示为已开发上线、个人主讲或个人推动交付。","公开材料只用脱敏摘要，不上传简历隐私、受试者信息、客户原始材料或华丰敏感数据。"]},{"title":"每日最小技术证明","steps":["亲自找出 Job Agent 前端入口、一个 API、Service 和 Storage 文件，写下各自职责。"]}]},{"day":2,"title":"定制简历、价值主张与立即投递","hours":"6–8h","focus":"不等 14 天学完；先用真实项目形成可投版本，再边投边补。","morning":"按复星类岗位调整简历排序：Job Agent 主项目、MosU 技术补充、华丰发现案例。","afternoon":"完成 Job Agent 的 15 秒、60 秒、5 分钟版本和公开安全作品索引。","evening":"投递满足实习时间的目标岗位，记录版本、日期、渠道和 JD。","deliverables":["FDE 简历 v2","岗位定制语句","作品索引","投递记录","第一条代码链"],"acceptance":"招聘方 30 秒能看懂‘我能发现问题，也能借助 AI 把方案交付出来’。","materials":["fde-resume-v1.md","Job Agent panorama","MosU 项目证据","华丰 ownership"],"framework":["投递和学习并行。","强动词写清主导决策、AI 协作实现和本人验收。","满足实习时间是该岗位的先决条件。"],"guides":[{"title":"每日最小技术证明","steps":["从一个页面请求追到 API handler，解释输入、输出和异常状态。"]}]},{"day":3,"title":"Job Agent：客户问题、工作流与范围","hours":"6–8h","focus":"把主项目讲成从业务断点到可验收薄切片的完整闭环。","morning":"还原用户从获取 JD 到形成投递决策的现状流程、断点、输入输出、成功标准和采用阻力。","afternoon":"定义薄切片、非目标、AI/规则/人工边界、Demo、验收与停止条件。","evening":"录制 5 分钟 FDE 主叙事并复盘‘为什么不是套壳’。","deliverables":["current-workflow.md","technical-scope.md","thin-slice-demo.md","链路文件索引","5 分钟录音"],"acceptance":"能解释为什么这样切范围，以及为什么它不是‘套一个大模型接口’。","materials":["Job Agent 用户旅程","API/ADR/测试证据","job-agent-panorama.md"],"framework":["先发现问题，再决定方案。","薄切片同时包含用户闭环、数据、Demo 和验收。","项目表达以 Job Agent 为主线。"],"guides":[{"title":"每日最小技术证明","steps":["为业务闭环标出页面、API、Service、Storage 和测试文件。"]}]},{"day":4,"title":"Job Agent：Agent 架构与完整调用链","hours":"6–8h","focus":"把框架名词落到真实模块、数据流和失败路径。","morning":"用 Model/Prompt/Tool/Knowledge/Memory/Workflow 六块解释现有系统；没有采用的能力明确说明原因。","afternoon":"追踪页面→API→Service→Storage→响应→页面的一条真实链路并画序列图。","evening":"练‘为什么用 Workflow/规则而非全自主 Agent’以及 RAG、MCP、A2A 是否需要。","deliverables":["agent-architecture.md","real-code-chain.md","失败路径表","技术选型问答"],"acceptance":"不看代码能讲清链路；打开代码能在 3 分钟内定位关键文件。","materials":["Job Agent 页面/API/Service/Storage","相关测试","架构 ADR"],"framework":["技术选型要解释为什么用和为什么不用。","理解模块不等于背代码。","失败路径必须有状态、日志和用户回退。"],"guides":[{"title":"每日最小技术证明","steps":["指出至少两个失败路径，以及日志、状态和用户提示分别落在哪里。"]}]},{"day":5,"title":"Job Agent：Eval、可信边界与反馈闭环","hours":"6–8h","focus":"用可复核评测证明阶段可行，而不是用测试数冒充用户价值。","morning":"核验并扩充 20 条黄金集、Rubric 与 Bad Case，区分离线质量、系统质量和用户价值。","afternoon":"写 AI/规则/人工职责矩阵、上线/回滚 Gate 和反馈闭环。","evening":"练‘90% 为什么不能上线’和‘没有真实用户数据如何证明阶段可行’。","deliverables":["golden-set-20.md","rubric.md","bad-case-taxonomy.md","边界矩阵","反馈闭环图","测试记录"],"acceptance":"能从 Bad Case 反推 Prompt、工具、数据、流程或人工兜底的改动。","materials":["EVIDENCE_FIT_SCORING.md","evaluation_corpus.v1.json","evidence-snapshot.md"],"framework":["总体得分会掩盖高风险子集失败。","离线 Eval、系统测试和用户价值是三类证据。","每个 Gate 要有失败动作和负责人。"],"guides":[{"title":"每日最小技术证明","steps":["运行一组相关测试，并解释它验证了什么、没有验证什么。"]}]},{"day":6,"title":"Job Agent：调试、部署与真实小改动","hours":"6–8h","focus":"形成 AI 协作开发条件下可演示的读、改、跑、测、排障与回滚能力。","morning":"选择一个非核心小改动，先写预期、影响范围和回滚方法，再用 AI 协作实现。","afternoon":"运行相关测试；故意制造或复现一个失败，查看日志并定位原因。","evening":"准备启动、配置、权限、日志、重试/幂等、失败恢复和部署边界口述。","deliverables":["小改动 diff","测试记录","故障复盘","deployment-decision-card.md"],"acceptance":"能展示‘需求→改动→测试→失败解释→回滚’，而非只展示 AI 生成结果。","materials":["Job Agent 真实代码","相关测试","MACOS_DISTRIBUTION.md"],"framework":["Vibe Coding 不降低验收责任。","部署脚本不等于生产上线。","不会时先定位输入、输出、状态和异常。"],"guides":[{"title":"每日最小技术证明","steps":["亲自解释一个关键 Python 函数的参数、返回值、异常和调用方。"]}]},{"day":7,"title":"Job Agent 技术/FDE Mock 与第二批投递","hours":"6–8h","focus":"用业务追问和技术追问同时校准主项目。","morning":"完成 5 分钟项目讲解、15 分钟业务追问和 15 分钟技术追问。","afternoon":"重点追问 Agent 边界、代码链、Tool Calling 失败、Eval、权限、部署和成本/延迟。","evening":"修最低分答案并完成第二批投递。","deliverables":["mock-job-agent-score.md","纠错清单","第二批投递记录"],"acceptance":"Job Agent 五维评分 ≥85，其中技术可行性不得低于 70。","materials":["前 6 天全部产物","FDE Mock 评分表"],"framework":["四档表达只改变密度，不改变事实。","技术可行性不能只靠架构图。","真实投递反馈决定第二周补强。"],"guides":[{"title":"每日最小技术证明","steps":["随机抽一个函数，说   function updateStageButtons(day) {
    var evidence = String(state.fde90.evidence[day] || "").trim();
    var understood = hasStage(day, "understand");
    var built = hasStage(day, "build");
    elements.content.querySelectorAll('button[data-stage][data-day="' + day + '"]').forEach(function (button) {
      var stage = button.getAttribute("data-stage");
      var checked = hasStage(day, stage);
      var locked = stage === "build" ? !understood || !evidence : stage === "transfer" ? !built || !evidence : false;
      button.disabled = locked;
      button.classList.toggle("checked", checked);
      button.innerHTML = "<span>" + (checked ? "✓ " : locked ? "🔒 " : "○ ") + "</span>" + escapeHtml(STAGE_LABELS[stage]);
    });
  }

  function toggleStage(day, stage) {
    if (STAGE_KEYS.indexOf(stage) < 0 || day < 1 || day > 90) return;
    var id = stageId(day, stage);
    var evidence = String(state.fde90.evidence[day] || "").trim();
    if (stage === "build" && (!hasStage(day, "understand") || !evidence)) return;
    if (stage === "transfer" && (!hasStage(day, "build") || !evidence)) return;
    if (state.fde90.stages.indexOf(id) >= 0) {
      state.fde90.stages = state.fde90.stages.filter(function (item) {
        if (item === id) return false;
        if (stage === "understand" && (item === stageId(day, "build") || item === stageId(day, "transfer"))) return false;
        if (stage === "build" && item === stageId(day, "transfer")) return false;
        return true;
      });
    } else {
      state.fde90.stages.push(id);
      state.fde90.stages.sort();
    }
    updateStageButtons(day);
    updateProgress();
    updateNavigationDone();
    saveState(STAGE_LABELS[stage] + "进度已更新");
  }

  function download(content, filename, type) {
    try {
      var blob = new Blob([content], { type: type });
      var url = window.URL.createObjectURL(blob);
      var anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 1000);
      showStatus("已生成 " + filename);
    } catch {
      showStatus("当前浏览器无法生成下载文件，请换用 Chrome 或 Safari。", true);
    }
  }

    imported.fde90.gate0 = payload.gate0 === true;
    if (payload.abilities && typeof payload.abilities === "object") {
      imported.fde90.abilities = (DATA.fde90.abilities || []).map(function (ability) { return clamp(payload.abilities[ability[0]], 1, 4); });
    }
    (payload.days || []).forEach(function (day) {
      var number = Number(day.day);
      if (!Number.isInteger(number) || number < 1 || number > 90) return;
      STAGE_KEYS.forEach(function (stage) { if (day[stage] === true) imported.fde90.stages.push(stageId(number, stage)); });
      if (typeof day.evidence === "string") imported.fde90.evidence[number] = day.evidence.slice(0, 50000);
    });
    return normalizeState(imported);
  }

  function parseImportedState(payload) {
    if (!payload || typeof payload !== "object") throw new Error("JSON 顶层必须是对象");
    if (payload.schema === "ai-fde-standalone-progress" && payload.state) return normalizeState(payload.state);
    if (payload.state && (payload.state.fde90 || payload.state.fde14)) return normalizeState(payload.state);
    if (payload.fde90 || payload.fde14) return normalizeState(payload);
    if (Array.isArray(payload.days) && payload.days.some(function (day) { return day && Object.prototype.hasOwnProperty.call(day, "understand"); })) return importPublicFde90(payload);
    throw new Error("无法识别此进度文件格式");
  }

  function handleImport(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showStatus("进度文件超过 5MB，已拒绝读取。", true);
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { showStatus("进度文件读取失败。", true); };
    reader.onload = function () {
      try {
        var imported = parseImportedState(JSON.parse(String(reader.result || "")));
        if (!window.confirm("导入将覆盖当前本地进度。是否继续？")) return;
        state = imported;
        saveState("进度导入成功");
        var targetHash = HASH_ROUTES[state.route];
        if (window.location.hash === targetHash) render();
        else window.location.hash = targetHash.slice(1);
        window.scrollTo({ top: 0 });
      } catch (error) {
        showStatus("导入失败：" + (error instanceof Error ? error.message : "JSON 格式错误"), true);
      } finally {
        elements.importFile.value = "";
      }
    };
    reader.readAsText(file, "utf-8");
  }

  function printCourse() {
    var records = Array.from(elements.content.querySelectorAll("details")).map(function (detail) { return detail.open; });
    elements.content.querySelectorAll("details").forEach(function (detail) { detail.open = true; });
    window.print();
    window.setTimeout(function () {
      elements.content.querySelectorAll("details").forEach(function (detail, index) { detail.open = records[index]; });
    }, 0);
  }

  function updateReadingProgress() {
    scrollFrame = 0;
    var maximum = document.documentElement.scrollHeight - window.innerHeight;
    var percentage = maximum > 0 ? Math.max(0, Math.min(100, window.scrollY / maximum * 100)) : 0;
    elements.readingLine.style.width = percentage.toFixed(2) + "%";
    var activeDay = null;
    elements.content.querySelectorAll(".searchable-day:not([hidden])").forEach(function (card) {
      if (card.getBoundingClientRect().top <= 145) activeDay = Number(card.getAttribute("data-day"));
    });
    elements.dayNav.querySelectorAll("button[data-jump]").forEach(function (button) {
      button.setAttribute("aria-current", Number(button.getAttribute("data-jump")) === activeDay ? "true" : "false");
    });
  }

  document.querySelectorAll("[data-course]").forEach(function (button) {
    button.addEventListener("click", function () { setCourse(button.getAttribute("data-course")); });
  });
  elements.menuOpen.addEventListener("click", openMenu);
  elements.menuClose.addEventListener("click", closeMenu);
  elements.menuScrim.addEventListener("click", closeMenu);
  elements.dayNav.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-jump]");
    if (button) jumpToDay(Number(button.getAttribute("data-jump")), true);
  });
  elements.content.addEventListener("click", function (event) {
    var stageButton = event.target.closest("button[data-stage]");
    if (stageButton) {
      toggleStage(Number(stageButton.getAttribute("data-day")), stageButton.getAttribute("data-stage"));
      return;
    }
    var courseButton = event.target.closest("button[data-course-card]");
    if (courseButton) {
      setCourse(courseButton.getAttribute("data-course-card"));
      return;
    }
    var actionButton = event.target.closest("button[data-action]");
    if (!actionButton) return;
    var action = actionButton.getAttribute("data-action");
    if (action === "gate0") {
      state.fde90.gate0 = !state.fde90.gate0;
      actionButton.classList.toggle("checked", state.fde90.gate0);
      actionButton.textContent = state.fde90.gate0 ? "✓ 项目口径已整理；之后按变化更新" : "确认：项目口径只整理一次，不是背诵任务";
      saveState("Gate 0 状态已更新");
    } else if (action === "show-choice-help") {
      showStatus("达到目标 JD 最低 Gate 就开始投递；90 天课程可与真实投递并行推进。", false);
    } else if (action === "toggle-day") {
      var day = Number(actionButton.getAttribute("data-day"));
      arrayToggle(state.fde14.completedDays, day);
      state.fde14.completedDays.sort(function (left, right) { return left - right; });
      var done = state.fde14.completedDays.indexOf(day) >= 0;
      actionButton.classList.toggle("checked", done);
      actionButton.textContent = done ? "✓ 今日已完成" : "标记 Day " + day + " 为完成";
      updateProgress();
      updateNavigationDone();
      saveState("Day " + day + " 进度已更新");
    } else if (action === "final-gate") {
      var gate = Number(actionButton.getAttribute("data-gate"));
      arrayToggle(state.fde14.finalGates, gate);
      state.fde14.finalGates.sort(function (left, right) { return left - right; });
      var checked = state.fde14.finalGates.indexOf(gate) >= 0;
      actionButton.classList.toggle("checked", checked);
      var gateText = DATA.fde14.config.finalGates[gate] || "投递 Gate";
      actionButton.textContent = (checked ? "✓ " : "○ ") + gateText;
      saveState("最终 Gate 已更新");
    }
  });
  elements.content.addEventListener("input", function (event) {
    var target = event.target;
    if (target.matches("textarea[data-evidence-day]")) {
      var day = Number(target.getAttribute("data-evidence-day"));
      state.fde90.evidence[day] = String(target.value).slice(0, 50000);
      updateStageButtons(day);
      saveState();
    } else if (target.matches("select[data-ability]")) {
      var ability = Number(target.getAttribute("data-ability"));
      state.fde90.abilities[ability] = clamp(target.value, 1, 4);
      saveState("能力等级已更新");
    } else if (target.matches("input[data-score]")) {
      var score = Number(target.getAttribute("data-score"));
      state.fde14.scores[score] = clamp(target.value, 0, 100);
      target.value = state.fde14.scores[score];
      saveState();
    }
  });
  elements.search.addEventListener("input", applySearch);
  elements.expandAll.addEventListener("click", function () {
    var visibleDetails = Array.from(elements.content.querySelectorAll("details")).filter(function (detail) { return !detail.closest("[hidden]"); });
    var shouldOpen = visibleDetails.some(function (detail) { return !detail.open; });
    visibleDetails.forEach(function (detail) { detail.open = shouldOpen; });
    elements.expandAll.textContent = shouldOpen ? "全部收起" : "全部展开";
  });
  elements.theme.addEventListener("click", function () {
    state.theme = state.theme === "light" ? "dark" : "light";
    applyTheme();
    saveState("主题已切换");
  });
  elements.exportJson.addEventListener("click", exportJson);
  elements.exportMd.addEventListener("click", exportMarkdown);
  elements.importTrigger.addEventListener("click", function () { elements.importFile.click(); });
  elements.importFile.addEventListener("change", function () { handleImport(elements.importFile.files && elements.importFile.files[0]); });
  elements.print.addEventListener("click", printCourse);
  elements.backTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  window.addEventListener("hashchange", function () {
    var parsed = parsedHash();
    var routeChanged = parsed.route !== renderedRoute;
    if (routeChanged) render();
    if (parsed.day) window.setTimeout(function () { jumpToDay(parsed.day, false); }, 0);
    else if (routeChanged) window.scrollTo({ top: 0 });
  });
  window.addEventListener("scroll", function () {
    if (!scrollFrame) scrollFrame = window.requestAnimationFrame(updateReadingProgress);
  }, { passive: true });
  window.addEventListener("keydown", function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      elements.search.focus();
    }
    if (event.key === "Escape") {
      closeMenu();
      elements.search.value = "";
      applySearch();
    }
  });

  var initial = parsedHash();
  if (!window.location.hash) {
    try { window.history.replaceState(null, "", HASH_ROUTES[initial.route]); } catch { /* file URL fallback */ }
  }
  render();
  if (initial.day) window.setTimeout(function () { jumpToDay(initial.day, false); }, 0);
  updateReadingProgress();
}());
</script>
</body>
</html>
